layout: default

<div class="phd-progress" id="phdProgress"></div>

{% include nav.html %}

{{ content }}

{% include footer.html %}

<script>
(function () {
    // ---- Scroll progress bar ----------------------------------------------
    var bar = document.getElementById('phdProgress');
    function updateProgress() {
        var h = document.documentElement;
        var max = (h.scrollHeight - h.clientHeight) || 1;
        var pct = (h.scrollTop / max) * 100;
        if (bar) bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();

    // ---- Intersection-observer reveal animations --------------------------
    var revealEls = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) {
                    e.target.classList.add('in-view');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.18, rootMargin: '0px 0px -10% 0px' });
        revealEls.forEach(function (el) { io.observe(el); });
    } else {
        revealEls.forEach(function (el) { el.classList.add('in-view'); });
    }

    // ---- Active section dot in the floating TOC ---------------------------
    var sections = document.querySelectorAll('.phd-section[id]');
    var dots = document.querySelectorAll('.phd-toc a[href^="#"]');
    function syncActiveDot() {
        var y = window.scrollY + window.innerHeight * 0.35;
        var current = null;
        sections.forEach(function (sec) {
            if (sec.offsetTop <= y) current = sec.id;
        });
        dots.forEach(function (d) {
            var target = d.getAttribute('href').slice(1);
            d.classList.toggle('active', target === current);
        });
    }
    window.addEventListener('scroll', syncActiveDot, { passive: true });
    syncActiveDot();

    // ---- Parallax tilt on figures (very gentle) ---------------------------
    var figs = document.querySelectorAll('.section-figure');
    window.addEventListener('scroll', function () {
        var vh = window.innerHeight;
        figs.forEach(function (f) {
            var r = f.getBoundingClientRect();
            var center = r.top + r.height / 2;
            var delta = (vh / 2 - center) / vh; // -0.5 .. 0.5
            f.style.transform = 'translateY(' + (delta * -16).toFixed(1) + 'px)';
        });
    }, { passive: true });
})();
</script>
