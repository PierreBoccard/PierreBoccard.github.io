---
layout: default
---
<div class="phd-progress" id="phdProgress"></div>

{% include nav.html %}

{{ content }}

{% include footer.html %}

<script>
(function () {
    /* Scroll progress bar */
    var bar = document.getElementById('phdProgress');
    function updateProgress() {
        var h = document.documentElement;
        var max = (h.scrollHeight - h.clientHeight) || 1;
        var pct = (h.scrollTop / max) * 100;
        if (bar) bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();

    /* Intersection-observer reveal animations */
    var revealEls = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) {
                    e.target.classList.add('in-view');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.18, rootMargin: '0px 0px -10% 0px' });
        revealEls.forEach(function (el) { io.observe(el); });
    } else {
        revealEls.forEach(function (el) { el.classList.add('in-view'); });
    }

    /* Active section dot in the floating TOC */
    var sections = document.querySelectorAll('.phd-section[id]');
    var dots = document.querySelectorAll('.phd-toc a[href^="#"]');
    function syncActiveDot() {
        var y = window.scrollY + window.innerHeight * 0.35;
        var current = null;
        sections.forEach(function (sec) {
            if (sec.offsetTop <= y) current = sec.id;
        });
        dots.forEach(function (d) {
            var target = d.getAttribute('href').slice(1);
            d.classList.toggle('active', target === current);
        });
    }
    window.addEventListener('scroll', syncActiveDot, { passive: true });
    syncActiveDot();

    /* Parallax tilt on figures (very gentle) */
    var figs = document.querySelectorAll('.section-figure');
    window.addEventListener('scroll', function () {
        var vh = window.innerHeight;
        figs.forEach(function (f) {
            var r = f.getBoundingClientRect();
            var center = r.top + r.height / 2;
            var delta = (vh / 2 - center) / vh;
            f.style.transform = 'translateY(' + (delta * -16).toFixed(1) + 'px)';
        });
    }, { passive: true });

    /* Image lightbox: click any figure image to enlarge */
    var lightbox = document.createElement('div');
    lightbox.className = 'phd-lightbox';
    lightbox.innerHTML = '<button class="close" aria-label="Close">&times;</button><img alt=""/><figcaption></figcaption>';
    document.body.appendChild(lightbox);
    var lbImg = lightbox.querySelector('img');
    var lbCap = lightbox.querySelector('figcaption');
    var lbClose = lightbox.querySelector('.close');

    function openLightbox(src, caption, alt) {
        lbImg.src = src;
        lbImg.alt = alt || '';
        lbCap.textContent = caption || '';
        lbCap.style.display = caption ? 'block' : 'none';
        lightbox.classList.add('is-open');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        lightbox.classList.remove('is-open');
        document.body.style.overflow = '';
    }

    document.querySelectorAll('.section-figure img').forEach(function (img) {
        img.addEventListener('click', function () {
            var fig = img.closest('figure');
            var cap = fig ? fig.querySelector('figcaption') : null;
            openLightbox(img.currentSrc || img.src, cap ? cap.textContent.trim() : '', img.alt);
        });
    });

    lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox || e.target === lbClose) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
    });
})();
</script>
