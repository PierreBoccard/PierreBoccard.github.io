<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Schematic of a cosmic void</title>
  <desc id="desc">An underdense spherical region surrounded by a denser galaxy filament network.</desc>
  <defs>
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7cf4ff" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#7cf4ff" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#7cf4ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7cf4ff" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1020" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020416" stop-opacity="1"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- background galaxy field -->
  <g fill="#c7d2fe" opacity="0.55">
    <circle cx="42" cy="58" r="1.2"/><circle cx="120" cy="22" r="0.9"/><circle cx="210" cy="85" r="1.1"/>
    <circle cx="320" cy="40" r="0.7"/><circle cx="430" cy="80" r="1.4"/><circle cx="540" cy="30" r="0.9"/>
    <circle cx="640" cy="70" r="1.1"/><circle cx="730" cy="110" r="0.8"/><circle cx="60" cy="160" r="0.9"/>
    <circle cx="100" cy="220" r="1.3"/><circle cx="50" cy="320" r="0.8"/><circle cx="40" cy="430" r="1.0"/>
    <circle cx="150" cy="460" r="0.9"/><circle cx="260" cy="430" r="1.1"/><circle cx="700" cy="180" r="1.0"/>
    <circle cx="760" cy="260" r="0.9"/><circle cx="745" cy="370" r="1.2"/><circle cx="660" cy="440" r="0.8"/>
    <circle cx="560" cy="455" r="1.0"/><circle cx="470" cy="445" r="0.7"/><circle cx="380" cy="465" r="1.1"/>
  </g>

  <!-- filaments (cosmic web edges) -->
  <g stroke="#3f8cff" stroke-width="1" opacity="0.45" fill="none" filter="url(#soft)">
    <path d="M40,40 C160,90 200,150 280,180 S420,220 560,140 700,80 770,60"/>
    <path d="M30,460 C140,420 220,380 320,400 S480,440 600,420 760,470 780,460"/>
    <path d="M50,250 C140,260 180,250 250,260"/>
    <path d="M560,250 C620,260 690,250 770,260"/>
    <path d="M120,80 C150,160 130,220 130,260"/>
    <path d="M680,90 C660,160 670,220 670,260"/>
    <path d="M130,440 C140,360 130,320 130,260"/>
    <path d="M670,440 C660,360 670,320 670,260"/>
  </g>

  <!-- denser galaxy clusters along filaments -->
  <g fill="#7cf4ff">
    <circle cx="120" cy="100" r="3"/><circle cx="130" cy="120" r="2"/><circle cx="140" cy="140" r="2.4"/>
    <circle cx="120" cy="260" r="3.2"/><circle cx="135" cy="280" r="2"/><circle cx="115" cy="240" r="2.5"/>
    <circle cx="130" cy="400" r="2.8"/><circle cx="140" cy="380" r="2"/><circle cx="120" cy="420" r="2.4"/>
    <circle cx="670" cy="100" r="3"/><circle cx="660" cy="120" r="2"/><circle cx="680" cy="140" r="2.4"/>
    <circle cx="680" cy="260" r="3.2"/><circle cx="660" cy="280" r="2"/><circle cx="690" cy="240" r="2.5"/>
    <circle cx="670" cy="400" r="2.8"/><circle cx="660" cy="380" r="2"/><circle cx="680" cy="420" r="2.4"/>
    <circle cx="400" cy="60" r="2.6"/><circle cx="380" cy="55" r="2"/><circle cx="420" cy="65" r="2"/>
    <circle cx="400" cy="445" r="2.6"/><circle cx="380" cy="450" r="2"/><circle cx="420" cy="440" r="2"/>
  </g>

  <!-- the void itself -->
  <g transform="translate(400 250)">
    <circle r="170" fill="url(#voidGlow)"/>
    <circle r="170" fill="none" stroke="#7cf4ff" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.85"/>
    <circle r="168" fill="none" stroke="#7cf4ff" stroke-width="0.5" opacity="0.5"/>
    <!-- a few sparse galaxies inside (low density) -->
    <circle cx="-40" cy="20" r="1.2" fill="#c7d2fe" opacity="0.7"/>
    <circle cx="60" cy="-30" r="1" fill="#c7d2fe" opacity="0.7"/>
    <circle cx="-10" cy="-60" r="0.9" fill="#c7d2fe" opacity="0.7"/>
    <circle cx="80" cy="50" r="1.1" fill="#c7d2fe" opacity="0.7"/>
    <!-- radius arrow -->
    <line x1="0" y1="0" x2="170" y2="0" stroke="#7cf4ff" stroke-width="1.2" opacity="0.9"/>
    <circle r="2.5" fill="#7cf4ff"/>
    <text x="60" y="-10" fill="#7cf4ff" font-family="'Space Grotesk', sans-serif" font-size="14" letter-spacing="1.5">R_void</text>
  </g>

  <!-- labels -->
  <g font-family="'Space Grotesk', sans-serif" fill="#c7d2fe">
    <text x="20" y="30" font-size="13" letter-spacing="2" opacity="0.85">COSMIC&#160;VOID</text>
    <text x="20" y="48" font-size="11" opacity="0.55">underdense region of the cosmic web</text>
  </g>
</svg>
