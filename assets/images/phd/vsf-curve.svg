<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Void Size Function</title>
  <desc id="desc">Number density of voids as a function of their effective radius, with a sensitivity band for photometric distortions.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#020416"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cf4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7cf4ff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- starfield -->
  <g fill="#c7d2fe" opacity="0.35">
    <circle cx="60" cy="40" r="0.8"/><circle cx="180" cy="20" r="1.0"/><circle cx="320" cy="60" r="0.6"/>
    <circle cx="460" cy="30" r="0.9"/><circle cx="600" cy="50" r="0.7"/><circle cx="740" cy="25" r="1.0"/>
    <circle cx="730" cy="470" r="0.9"/><circle cx="630" cy="450" r="0.8"/><circle cx="50" cy="470" r="0.7"/>
  </g>

  <!-- axes -->
  <g stroke="#3f8cff" stroke-width="1.2" opacity="0.8" fill="none">
    <line x1="90" y1="60" x2="90" y2="430"/>
    <line x1="90" y1="430" x2="740" y2="430"/>
    <!-- ticks -->
    <g stroke-width="1">
      <line x1="90" y1="430" x2="90" y2="436"/>
      <line x1="190" y1="430" x2="190" y2="436"/>
      <line x1="290" y1="430" x2="290" y2="436"/>
      <line x1="390" y1="430" x2="390" y2="436"/>
      <line x1="490" y1="430" x2="490" y2="436"/>
      <line x1="590" y1="430" x2="590" y2="436"/>
      <line x1="690" y1="430" x2="690" y2="436"/>
      <line x1="84" y1="80" x2="90" y2="80"/>
      <line x1="84" y1="160" x2="90" y2="160"/>
      <line x1="84" y1="240" x2="90" y2="240"/>
      <line x1="84" y1="320" x2="90" y2="320"/>
      <line x1="84" y1="400" x2="90" y2="400"/>
    </g>
  </g>

  <!-- axis labels -->
  <g fill="#c7d2fe" font-family="'Space Grotesk', sans-serif" font-size="13" letter-spacing="1">
    <text x="410" y="470" text-anchor="middle">void radius  R  [h⁻¹ Mpc]</text>
    <text transform="rotate(-90 38 245)" x="38" y="245" text-anchor="middle">dn / d ln R</text>
    <text x="190" y="450" text-anchor="middle" font-size="11" opacity="0.7">10</text>
    <text x="290" y="450" text-anchor="middle" font-size="11" opacity="0.7">20</text>
    <text x="390" y="450" text-anchor="middle" font-size="11" opacity="0.7">30</text>
    <text x="490" y="450" text-anchor="middle" font-size="11" opacity="0.7">40</text>
    <text x="590" y="450" text-anchor="middle" font-size="11" opacity="0.7">60</text>
    <text x="690" y="450" text-anchor="middle" font-size="11" opacity="0.7">80</text>
  </g>

  <!-- sensitivity band (photo-z systematic envelope) -->
  <path d="M120,370 C190,260 290,180 390,160 C490,180 590,220 690,310 L690,360 C590,300 490,260 390,230 C290,250 190,310 120,400 Z"
        fill="url(#bandGrad)" opacity="0.6"/>

  <!-- spec-z fiducial VSF -->
  <path d="M120,400 C200,290 300,210 400,200 C500,210 600,260 700,340"
        stroke="#7cf4ff" stroke-width="2.5" fill="none" opacity="0.95"/>
  <!-- photo-z biased VSF -->
  <path d="M120,360 C200,280 300,230 400,225 C500,230 600,255 700,300"
        stroke="#ff7adf" stroke-width="2.2" fill="none" stroke-dasharray="6 5" opacity="0.95"/>

  <!-- data points with error bars (spec-z) -->
  <g stroke="#7cf4ff" stroke-width="1.4" fill="#0b1020">
    <g><line x1="180" y1="345" x2="180" y2="395"/><circle cx="180" cy="370" r="4"/></g>
    <g><line x1="260" y1="265" x2="260" y2="305"/><circle cx="260" cy="285" r="4"/></g>
    <g><line x1="350" y1="215" x2="350" y2="245"/><circle cx="350" cy="230" r="4"/></g>
    <g><line x1="450" y1="210" x2="450" y2="240"/><circle cx="450" cy="225" r="4"/></g>
    <g><line x1="540" y1="240" x2="540" y2="275"/><circle cx="540" cy="258" r="4"/></g>
    <g><line x1="630" y1="290" x2="630" y2="325"/><circle cx="630" cy="307" r="4"/></g>
  </g>

  <!-- legend -->
  <g font-family="'Space Grotesk', sans-serif" font-size="12" fill="#c7d2fe">
    <rect x="500" y="80" width="220" height="78" fill="#0b1020" stroke="#3f8cff" opacity="0.85" rx="6"/>
    <line x1="515" y1="100" x2="555" y2="100" stroke="#7cf4ff" stroke-width="2.5"/>
    <text x="565" y="104">spec-z fiducial VSF</text>
    <line x1="515" y1="125" x2="555" y2="125" stroke="#ff7adf" stroke-width="2.2" stroke-dasharray="6 5"/>
    <text x="565" y="129">photo-z biased VSF</text>
    <rect x="515" y="140" width="40" height="10" fill="url(#bandGrad)"/>
    <text x="565" y="150">systematic envelope</text>
  </g>

  <!-- title -->
  <g font-family="'Space Grotesk', sans-serif" fill="#c7d2fe">
    <text x="100" y="35" font-size="14" letter-spacing="3" opacity="0.9">VOID&#160;SIZE&#160;FUNCTION</text>
    <text x="100" y="52" font-size="11" opacity="0.55">abundance of voids vs. effective radius</text>
  </g>
</svg>
